---
name: Trigger AWX on push to main

on:
  push:
    branches:
      - main
    paths-ignore:
      - provision/**
      - .gitignore
      - '**Makefile'
      - '**.md'
      - 'set_env*'

permissions: {}

concurrency:
  group: infra-dbp-master

jobs:
  trigger_awx:
    uses: dbildungsplattform/infra-tools/.github/workflows/trigger-awx.yaml@main
    with:
      job_id: 107
    secrets:
      AWX_TOKEN: ${{ secrets.AWX_TOKEN }}
